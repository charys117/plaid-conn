services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plaid_conn}
      POSTGRES_USER: ${POSTGRES_USER:-plaid_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plaid_admin} -d ${POSTGRES_DB:-plaid_conn}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    command: ["node", "dist/server/server/index.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://plaid_app:${APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-plaid_conn}
      PLAID_PROFILES_FILE: /app/config/plaid-profiles.json
    volumes:
      - ./config/plaid-profiles.json:/app/config/plaid-profiles.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    networks: [internal]

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist/server/worker/index.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://plaid_app:${APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-plaid_conn}
      PLAID_PROFILES_FILE: /app/config/plaid-profiles.json
    volumes:
      - ./config/plaid-profiles.json:/app/config/plaid-profiles.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
